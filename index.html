<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFC Treasure Hunt</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            animation: appear 0.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .emoji {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 36px;
        }

        .progress {
            color: #777;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .clue {
            font-size: 24px;
            line-height: 1.5;
            margin: 30px 0;
        }

        .instruction {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            margin-top: 30px;
        }

        .final {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
        }

        @media (max-width: 500px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .clue {
                font-size: 21px;
            }

            .instruction {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="card" id="card">

    <div class="emoji" id="emoji">🔎</div>

    <h1 id="title">Loading...</h1>

    <div class="progress" id="progress"></div>

    <div class="clue" id="clue"></div>

    <div class="instruction" id="instruction"></div>

</div>


<script>

const clues = {

    "001": {
        title: "Clue 1",
        clue: "Head to somewhere where you might find glasses."
    },

    "002": {
        title: "Clue 2",
        clue: "Go where the coffee pods live."
    },

    "003": {
        title: "Clue 3",
        clue: "Head to where you might find out how to cook."
    },

    "004": {
        title: "Clue 4",
        clue: "Go where the TV remote normally lives."
    },

    "005": {
        title: "Clue 5",
        clue: "Where can you play some music?"
    },

    "006": {
        title: "You found it!",
        clue: "Well done you found the last one! Head back to the kitchen."
    }

};


// Get the ID from the URL
const parameters = new URLSearchParams(window.location.search);
const id = parameters.get("id");


// Check that the clue exists
if (clues[id]) {

    document.getElementById("title").textContent = clues[id].title;
    document.getElementById("clue").textContent = clues[id].clue;


    // Final clue
    if (id === "006") {

        document.getElementById("emoji").textContent = "🎉";

        document.getElementById("progress").textContent =
            "Treasure hunt complete!";

        document.getElementById("card").classList.add("final");

        document.getElementById("instruction").textContent =
            "🎉 Great job! You found them all!";

    } else {

        document.getElementById("progress").textContent =
            "Clue " + parseInt(id) + " of 6";

        document.getElementById("instruction").textContent =
            "Great job! Tap the card against the back of the phone for the next clue.";

    }

} else {

    document.getElementById("emoji").textContent = "❓";

    document.getElementById("title").textContent =
        "Clue not found";

    document.getElementById("clue").textContent =
        "This NFC tag doesn't have a valid clue.";

    document.getElementById("progress").textContent = "";

    document.getElementById("instruction").textContent = "";

}

</script>

</body>
</html>
