<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Message</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f2f2f2;
        }

        .message {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 80%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 36px;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="message">
    <h1 id="title">NFC Message</h1>
    <p id="text">Loading...</p>
</div>

<script>

const messages = {

    "001": {
        title: "Clue 1",
        text: "Head to somewhere where you might find glasses."
    },

    "002": {
        title: "Clue 2",
        text: "Go where the coffee pods live."
    },

    "003": {
        title: "Clue 3",
        text: "Head to where you might find out how to cook."
    },

    "004": {
        title: "Clue 4",
        text: "Go where the TV remote normally lives."
    },

    "005": {
        title: "Clue 5",
        text: "Where can you play some music?"
    },

    "006": {
        title: "You found it!",
        text: "Well done you found the last one! Head back to the kitchen."
    }

};


const parameters = new URLSearchParams(window.location.search);
const id = parameters.get("id");

if (messages[id]) {

    document.getElementById("title").textContent = messages[id].title;
    document.getElementById("text").textContent = messages[id].text;

} else {

    document.getElementById("title").textContent = "NFC Tag";
    document.getElementById("text").textContent = "No message was found for this tag.";

}

</script>

</body>
</html>
